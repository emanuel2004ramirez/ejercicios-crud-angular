<form (ngSubmit)="agregarTarea()">
    <label for="titulo">Título:</label>
    <input type="text" id="titulo" [(ngModel)]="titulo" name="titulo" required>

    <label for="descripcion">Descripción:</label>
    <input type="text" name="descripcion" [(ngModel)]="descripcion">
    <label for="fechaLimite">Fecha límite:</label>
    <input type="date" name="fechaLimite" [(ngModel)]="fechaLimite">
    <label>Estado:</label>
  <select name="completada" [(ngModel)]="completada">
    <option [ngValue]="false">Pendiente</option>
    <option [ngValue]="true">Completada</option>
  </select>

    <button type="submit">Agregar Tarea</button>
</form>
<button (click)="limpiar()">Cancelar</button>

<table border="1">
    <thead>
        <tr>
            <th>ID</th>
            <th>Título</th>
            <th>Descripción</th>
            <th>Estado</th>
            <th>Fecha límite</th>
            <th>Acciones</th>
        </tr>

    </thead>
    <tbody>
        @for (tarea of tareas; track  tarea.id) {
        <tr>
            <td>{{ tarea.id }}</td>
            <td>{{ tarea.titulo }}</td>
            <td>{{ tarea.descripcion }}</td>
            <td>{{ tarea.completada ? 'Completada' : 'Pendiente' }}</td>
            <td>{{ tarea.fechaLimite }}</td>
            <td>
                <button (click)="updateTarea($index)">Editar</button>
                <button (click)="eliminarTarea($index)">Eliminar</button>
            </td>
        </tr>
    } @empty {
        <p>No hay tareas disponibles. </p>
    }
    </tbody>
</table>

<button (click)="cerrarSesion()">Cerrar sesión</button>
