<p>Bienvenido!</p>
<form (ngSubmit)="login()">
  <label for="username">Usuario:</label>
  <input type="text" id="username" name="username" [(ngModel)]="usuario" required>
  <br>
  <label for="password">Contraseña:</label>
  <input type="password" id="password" name="password" [(ngModel)]="clave" required>
  <br>
  <button type="submit">Iniciar sesión</button>
</form>
