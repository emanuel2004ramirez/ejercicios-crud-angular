<form (ngSubmit)="create()">
    <label>Nombre</label>
    <input name="nombre" [(ngModel)]="nombre">
    <label>Especie</label>'
    <input name="espeie" [(ngModel)]="especie">
    <label>Edad</label>
    <input type="number" name="edad" [(ngModel)]="edad">
    <label>Propietario</label>
    <input name="propietario" [(ngModel)]="propietario">


<button type="submit">Enviar</button>


</form>
<button type="button" (click)="limpiar()">Cancelar</button>

<table border="4">  
    <thead>
        <th>ID</th>
        <th>Nombre</th>
        <th>Especie</th>
        <th>Edad</th>
        <th>Propietario</th>
        <th>Acciones</th>
    </thead>
    <tbody>
        @for (mascota of mascotas; track mascota.id){
            <tr>
                <td>{{mascota.id}}</td>
                <td>{{mascota.nombre}}</td>
                <td>{{mascota.especie}}</td>
                <td>{{mascota.edad}}</td>
                <td>{{mascota.propietario}}</td>
                <td>
                    <button type="button" (click)="update($index)">Editar</button>

                </td>
            </tr>

        } @empty { 
            <h3>No hay mascotas registrardas</h3>
        }
        
    </tbody>

</table>
<p>Total de mascotas registradas: {{mascotas.length}}</p>
