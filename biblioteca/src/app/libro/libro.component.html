<table border="1">
  <thead>
    <tr>
      <th>ID</th>
      <th>Código</th>
      <th>Título</th>
      <th>Autor</th>
      <th>Año</th>
    </tr>
  </thead>
  <tbody>
    @for (libro of libros; track libro.id) {
      <tr>
      <td>{{ libro.id }}</td>
      <td>{{ libro.codigo }}</td>
      <td>{{ libro.titulo }}</td>
      <td>{{ libro.autor }}</td>
      <td>{{ libro.anio }}</td>
    </tr>
}

  </tbody>
</table>
  <h3>Agregar Libro</h3>
  <form (ngSubmit)="guardar()">
    <label for="codigo">Código:</label>
    <input type="text" id="codigo" [(ngModel)]="codigo" name="codigo" required>
    <br>
    <label for="titulo">Título:</label>
    <input type="text" id="titulo" [(ngModel)]="titulo" name="titulo" required>
    <br>
    <label for="autor">Autor:</label>
    <input type="text" id="autor" [(ngModel)]="autor" name="autor" required>
    <br>
    <label for="anio">Año:</label>
    <input type="number" id="anio" [(ngModel)]="anio" name="anio" required>
    <br>
    <button type="submit">Agregar</button>
  </form>
